name: Backend Critical Tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  critical-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run critical test suite
        run: |
          pytest \
            tests/test_users.py \
            tests/test_estoque_v2.py \
            tests/test_ocr.py::test_ocr_upload_imagem_retorna_422 \
            tests/test_ocr.py::test_ocr_upload_pdf_retorna_422 \
            tests/test_ocr.py::test_ocr_status_task_inexistente_retorna_404 \
            tests/test_ocr.py::test_ocr_xml_invalido_retorna_400 \
            -v
